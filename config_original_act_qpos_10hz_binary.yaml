# =============================================================================
# Original ACT policy trained from the 10 Hz qpos binary dataset
# =============================================================================
server:
  address: "tcp://0.0.0.0:5555"
  connect_address: "tcp://localhost:5555"
  policy: "act_original_qpos_10hz_binary"
  # Point this at the checkpoint trained from hdf5_qpos_10hz_binary.
  # Do not silently reuse a checkpoint trained from a different sampling/data contract.
  checkpoint: "/home/user/catkin_ws/src/iiwa_python/src/my_ACT/ckpt6_9"
  device: "cuda"

  # --- Original ACT, 10 Hz qpos binary specific ---
  act_root: "/home/user/catkin_ws/src/iiwa_python/src/my_ACT"
  # Must exactly match --chunk_size used while training the checkpoint.
  act_chunk_size: 20
  act_hidden_dim: 512
  act_dim_feedforward: 3200
  act_kl_weight: 10  #10
  n_action_steps: 1
  act_temporal_agg: true
  #act_temporal_agg: false
  act_ensemble_decay: 0.01

  # Names used when the ACT model was trained
  act_camera_names: ["cam_front", "cam_wrist"]
  # Image keys produced by this repo's bridge/client
  act_camera_sources: ["front", "wrist"]
  act_image_height: 480
  act_image_width: 640

  # Current server messages only expose `joint_positions` + `gripper_state`.
  # If your ACT model was trained on Cartesian pose, the bridge still needs to
  # pack Cartesian pose into this field.
  act_state_key: "joint_positions"
  # /action_qpos stores the absolute command pose.
  act_action_pose_mode: "absolute"

  # bag2hdf5_qpos_10hz_binary_strict.py converts both observation and action
  # gripper values to 1=closed, 0=open.
  act_input_gripper_mode: "binary"
  act_output_gripper_mode: "binary"
  act_gripper_width_min: 0.0
  act_gripper_width_max: 0.085
  # Must match GRIPPER_CLOSED_WIDTH_THRESHOLD in the HDF5 conversion script.
  act_gripper_closed_width_threshold: 0.068
  # Convert denormalized model output to a hard binary command.
  act_binary_action_threshold: 0.5
  act_debug_actions: true
  act_debug_interval: 50

# =============================================================================
# Cameras
# =============================================================================
cameras:
  - name: "front"
    # Runtime subscribes to the raw camera and samples it in the 10 Hz bridge
    # loop. The *_10hz names only exist while the recorder republisher runs.
    topic: "/cam_1/color/image_raw"
    serial: "308222301757"
    width: 640
    height: 480
    fps: 30
    mode: "rgb"
    encoding: "bgr8"
  - name: "wrist"
    # Keep bgr8: bag2hdf5_qpos_10hz_binary_strict.py stores bgr8 arrays.
    topic: "/cam_2/color/image_raw"
    serial: "306322300452"
    width: 640
    height: 480
    fps: 30
    mode: "rgb"
    encoding: "bgr8"

# =============================================================================
# Robot
# =============================================================================
robot:
  type: "kuka_iiwa"
  home_position: [0, 0, 0, -1.57, 0, 1.57, 0]
  home_cartesian_pose: [0.61, 0.0, 0.37, 0.0, 0.9998, 0.0, -0.0175]
  workspace_xyz:
    - [0.45, 0.75]
    - [-0.22, 0.42]
    - [0.190, 1.0]
  bridge_host: "192.168.1.100"
  bridge_port: 6000

# =============================================================================
# Control loop parameters
# =============================================================================
control:
  hz: 10
  max_steps: 300
  num_episodes: 10

# =============================================================================
# ROS Bridge settings
# =============================================================================
ros_bridge:
  server_address: "tcp://192.168.1.103:5555"
  hz: 10
  jpeg_quality: 50
  max_steps: 300
  num_episodes: 10

ros_bridge_original_act_qpos_10hz_binary:
  server_address: "tcp://192.168.1.105:5555"
  # Match teleop_position_iiwa_test_qpos_topics_10hz.py and the recorded data.
  hz: 10
  jpeg_quality: 95
  # 1000 steps at 10 Hz is 100 seconds. Adjust for the desired rollout duration.
  max_steps: 300
  num_episodes: 10
  pose_frame_id: "iiwa_link_0"
  gripper_feedback_mode: "width"
  gripper_command_mode: "width"
  camera_source: "ros_topics"
